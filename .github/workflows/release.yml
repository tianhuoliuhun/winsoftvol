name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Build (x64)
        run: cargo build --release

      - name: Build (x86)
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Build (ARM64)
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Package
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          HASH=$(git rev-parse --short HEAD)
          cp target/release/winsoftvol.exe "winsoftvol-${VERSION}-${HASH}.exe"
          cp target/i686-pc-windows-msvc/release/winsoftvol.exe "winsoftvol-${VERSION}-${HASH}-x86.exe"
          cp target/aarch64-pc-windows-msvc/release/winsoftvol.exe "winsoftvol-${VERSION}-${HASH}-arm64.exe"
          echo "ASSET_X64=winsoftvol-${VERSION}-${HASH}.exe" >> $GITHUB_ENV
          echo "ASSET_X86=winsoftvol-${VERSION}-${HASH}-x86.exe" >> $GITHUB_ENV
          echo "ASSET_ARM64=winsoftvol-${VERSION}-${HASH}-arm64.exe" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_X64 }}
            ${{ env.ASSET_X86 }}
            ${{ env.ASSET_ARM64 }}
          generate_release_notes: true
