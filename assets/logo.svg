<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bridge arch gradient — hardware blue to software cyan -->
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d95f5"/>
      <stop offset="100%" stop-color="#29c5f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#0d1117" rx="14"/>

  <!--
    Bridge mark — same artwork as the app icon: two pillars (hardware and
    software) joined by an arch, with signal dots flowing underneath.
  -->
  <g transform="translate(-15,-22)">
    <path d="M 74,120 Q 128,48 182,120"
          stroke="url(#arch)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <rect x="52" y="120" width="44" height="76" rx="12" fill="#1d95f5"/>
    <rect x="160" y="120" width="44" height="76" rx="12" fill="#29c5f6"/>
    <circle cx="104" cy="168" r="5" fill="#e6edf3"/>
    <circle cx="128" cy="168" r="5" fill="#e6edf3"/>
    <circle cx="152" cy="168" r="5" fill="#e6edf3"/>
  </g>

  <!-- Separator -->
  <rect x="226" y="20" width="1" height="160" fill="#21262d"/>

  <!-- Title -->
  <text x="256" y="108"
        font-family="Segoe UI, SF Pro Display, system-ui, sans-serif"
        font-size="50" font-weight="800"
        fill="#e6edf3" letter-spacing="-1">WinSoftVol</text>

  <!-- Tagline -->
  <text x="259" y="138"
        font-family="Segoe UI, system-ui, sans-serif"
        font-size="13" fill="#6e7681" letter-spacing="0.5">Software Volume Bridge · Windows USB Audio</text>
</svg>
