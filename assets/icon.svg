<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bridgeArch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d95f5"/>
      <stop offset="100%" stop-color="#29c5f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="#0d1117" rx="40"/>

  <!-- Bridge arch -->
  <path d="M 74,120 Q 128,48 182,120"
        stroke="url(#bridgeArch)" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Left pillar: hardware -->
  <rect x="52" y="120" width="44" height="76" rx="12" fill="#1d95f5"/>

  <!-- Right pillar: software -->
  <rect x="160" y="120" width="44" height="76" rx="12" fill="#29c5f6"/>

  <!-- Signal dots -->
  <g fill="#e6edf3">
    <circle cx="104" cy="168" r="5"/>
    <circle cx="128" cy="168" r="5"/>
    <circle cx="152" cy="168" r="5"/>
  </g>
</svg>
